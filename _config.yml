title: Theo Avila
name: Theo Avila
description: "Research on climate impacts, uncertainty, and the ocean."
url: "https://theo-avila.github.io"
baseurl: ""
lang: en
email: tcavila@mit.edu
scholar_url: "https://scholar.google.com/citations?user=lwAh46AAAAAJ&hl=en"
timezone: America/New_York

# Optional: add a real portrait path here when you want to display one.
# Leave blank for the typography-led home page.
portrait:

markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-sitemap
include:
  - _pages
exclude:
  - vendor
  - node_modules
  - docs
  - test
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG.md
  - LICENSE
  - Rakefile
  - minimal-mistakes-jekyll.gemspec
  - package.json
  - package-lock.json
  - staticman.yml
  - screenshot.png
  - screenshot-layouts.png
  - assets/js
  - assets/css/main.scss
  - assets/bio-photo.jpg
  - assets/publications.jpg
  - assets/publications1.png

defaults:
  - scope:
      path: ""
    values:
      layout: academic
