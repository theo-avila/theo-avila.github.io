<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.canonical_path | default: page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.canonical_path | default: page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.name | escape }}<span aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation">
        {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
        {% endfor %}
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} {{ site.name | escape }}</span>
      <div><a href="mailto:{{ site.email }}">Email</a><a href="{{ site.scholar_url }}">Google Scholar <span aria-hidden="true">↗</span></a></div>
    </footer>
  </div>
</body>
</html>
